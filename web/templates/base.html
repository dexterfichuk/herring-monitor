<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herring Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #faf9f5;
      --surface: #ffffff;
      --surface-hover: #f5f3ed;
      --border: #e5e0d5;
      --border-hover: #c4b89e;
      --text: #2c2416;
      --text-secondary: #6b5e4a;
      --text-muted: #9b8d7a;
      --accent: #5b8731;
      --accent-light: #e8f0dd;
      --spawn: #5b8731;
      --spawn-bg: #e8f0dd;
      --possible: #c27a1a;
      --possible-bg: #fdf0d8;
      --danger: #c53030;
      --danger-bg: #fde8e8;
      --blue: #3b6fb6;
      --blue-bg: #e3edf8;
      --shadow-sm: 0 1px 2px rgba(44,36,22,0.04);
      --shadow: 0 1px 3px rgba(44,36,22,0.06), 0 1px 2px rgba(44,36,22,0.04);
      --shadow-md: 0 4px 12px rgba(44,36,22,0.06), 0 2px 4px rgba(44,36,22,0.04);
      --shadow-lg: 0 12px 32px rgba(44,36,22,0.08), 0 4px 8px rgba(44,36,22,0.04);
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --max-width: 1344px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "SF Mono", "Fira Code", "Fira Mono", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.92);
    }
    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      height: 52px;
      gap: 6px;
    }
    .logo {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: -0.01em;
      margin-right: auto;
    }
    .logo svg { vertical-align: -3px; margin-right: 4px; }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      transition: all 0.15s;
    }
    .nav-link:hover { color: var(--text); background: var(--surface-hover); }
    .nav-link.active { color: var(--accent); background: var(--accent-light); }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-btn:hover { border-color: var(--border-hover); color: var(--text); }

    /* Mobile nav */
    .mobile-nav-toggle { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px 8px; }
    @media (max-width: 640px) {
      .mobile-nav-toggle { display: block; }
      .nav-link, .nav-btn { display: none; }
      .header-inner { gap: 2px; }
      header.nav-open .nav-link, header.nav-open .nav-btn { display: flex; }
      header.nav-open {
        background: var(--surface);
      }
      header.nav-open .header-inner {
        flex-wrap: wrap;
        height: auto;
        padding: 10px 20px;
        gap: 4px;
      }
      header.nav-open .logo { width: 100%; margin-bottom: 4px; }
    }

    /* Main */
    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 20px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      text-decoration: none;
      transition: all 0.15s;
      line-height: 1.4;
    }
    .btn:hover { border-color: var(--border-hover); box-shadow: var(--shadow-sm); }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #4e7528; border-color: #4e7528; }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn-ghost:hover { background: var(--surface-hover); border-color: var(--border); }
    .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: var(--radius-sm); }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all 0.2s;
    }
    .card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    /* Labels */
    .label-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font);
      transition: all 0.15s;
    }
    .label-btn:hover { border-color: var(--border-hover); }
    .label-btn.spawn { color: var(--spawn); }
    .label-btn.spawn:hover { background: var(--spawn-bg); border-color: var(--spawn); }
    .label-btn.nospawn { color: var(--danger); }
    .label-btn.nospawn:hover { background: var(--danger-bg); border-color: var(--danger); }
    .label-btn.quick { padding: 4px 10px; font-size: 11px; border-radius: var(--radius-sm); }
    .label-btn.active-spawn { background: var(--spawn-bg) !important; border-color: var(--spawn) !important; color: var(--spawn) !important; }
    .label-btn.active-nospawn { background: var(--danger-bg) !important; border-color: var(--danger) !important; color: var(--danger) !important; }
    .label-btn.active-skip { background: var(--surface-hover) !important; border-color: var(--text-muted) !important; color: var(--text-muted) !important; }

    .saved-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved-indicator.show { opacity: 1; }

    /* Section heading */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .section-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* Search */
    .search-input {
      width: 100%;
      max-width: 340px;
      padding: 8px 14px 8px 36px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,135,49,0.12); }
    .search-wrap { position: relative; display: inline-block; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

    /* Badge / pill */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .pill-spawn { background: var(--spawn-bg); color: var(--spawn); }
    .pill-possible { background: var(--possible-bg); color: var(--possible); }
    .pill-neutral { background: #f3f0ea; color: var(--text-muted); }
    .pill-blue { background: var(--blue-bg); color: var(--blue); }

    /* Filter count */
    .filter-count { font-size: 13px; color: var(--text-muted); font-weight: 400; }

    /* Timeline & events styles (shared) */
    .timeline-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 440px;
      scroll-behavior: smooth;
    }
    .timeline-cell {
      width: 30px; height: 24px; border-radius: 3px; text-align: center;
      cursor: pointer; position: relative; transition: transform 0.1s;
    }
    .timeline-cell:hover { transform: scale(1.3); z-index: 1; }
    .event-card-link {
      min-width: 170px; max-width: 200px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; flex-shrink: 0;
      text-decoration: none; color: inherit;
      transition: all 0.15s;
    }
    .event-card-link:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--spawn); }

    /* Map */
    .map-container {
      height: 340px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    @media (max-width: 640px) {
      .map-container { height: 260px; border-radius: var(--radius); }
    }

    /* Shortcuts legend */
    .shortcuts-legend {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      font-size: 12px;
      color: var(--text-secondary);
      z-index: 9998;
      display: none;
      box-shadow: var(--shadow-lg);
      max-width: 280px;
      line-height: 1.8;
    }
    .shortcuts-legend kbd {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--text);
      font-size: 11px;
      margin: 0 2px;
    }

    /* Focused card */
    .card.focused { border-color: var(--blue) !important; box-shadow: 0 0 0 3px rgba(59,111,182,0.18); }

    /* Forms */
    form { display: grid; gap: 14px; max-width: 420px; }
    form input, form select {
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      transition: border-color 0.15s;
    }
    form input:focus, form select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,135,49,0.12); }

    /* Flash messages */
    .flash { padding: 10px 16px; margin-bottom: 16px; border-radius: var(--radius); font-size: 14px; }
    .flash-error { background: var(--danger-bg); color: var(--danger); }

    /* Empty state */
    .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty p { font-size: 15px; }

    /* Utility */
    .flex-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .gap-sm { gap: 6px; }
    .mt-sm { margin-top: 12px; }
    .mt-md { margin-top: 20px; }
    .mt-lg { margin-top: 28px; }
    .mb-sm { margin-bottom: 12px; }
    .mb-md { margin-bottom: 20px; }
    .text-sm { font-size: 13px; }
    .text-xs { font-size: 11px; }
    .text-secondary { color: var(--text-secondary); }
    .text-muted { color: var(--text-muted); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

    /* Select styling */
    select {
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
    }
  </style>
</head>
<body>
<header id="siteHeader">
  <div class="header-inner">
    <a href="/" class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 2c-2 4-8 6-8 12 0 4.4 3.6 8 8 8s8-3.6 8-8c0-6-6-8-8-12z"/></svg>
      Herring Monitor
    </a>
    <button class="mobile-nav-toggle" onclick="document.getElementById('siteHeader').classList.toggle('nav-open')" aria-label="Menu">&#9776;</button>
    <a href="/" class="nav-link active">Dashboard</a>
    <a href="/sweep" class="nav-link">Sweep</a>
    <a href="/add" class="nav-link">+ Add Location</a>
    <a href="/api/refresh" onclick="fetch('/api/refresh',{method:'POST'});return false" class="nav-btn">&#8635; Refresh</a>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
