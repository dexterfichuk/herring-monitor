{% extends "base.html" %}
{% block content %}
<h2 class="section-title">Login</h2>
{% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
<form method="POST">
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit" class="btn">Log In</button>
</form>
{% endblock %}
